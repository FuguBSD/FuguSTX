name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: FuguBSD/Tooling/python/actions/setup-uv@main

      # The format gate runs prettier through bunx.
      - name: Setup bun
        uses: FuguBSD/Tooling/actions/setup-bun@main

      # infra-fmt-check and infra-validate need the OpenTofu binary that
      # deps/Linux.txt names.
      - name: Install dependencies
        run: |
          make deps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The gitleaks gate scans the full git history, so the
      # checkout above stays at fetch-depth 0 (WFL-GITLEAKS-2).
      - name: Setup gitleaks
        uses: FuguBSD/Tooling/actions/setup-gitleaks@main

      - name: Check
        run: make check

      # EVL-TIERS-2: tier T0 runs on the CPU, on every commit. No model
      # exists before phase P3, so this scores the freshly-fetched dev
      # split against itself.
      - name: Tier T0 self-check
        run: uv run --locked python -m stx_corpus.t0

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run: scripts/spec-check --drift "origin/${{ github.base_ref }}"

  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FuguBSD/Tooling
        uses: actions/checkout@v4
        with:
          repository: FuguBSD/Tooling
          path: tooling

      # The synced copies must match FuguBSD/Tooling exactly.
      - name: Verify the synced copies
        run: ./tooling/scripts/sync --check
