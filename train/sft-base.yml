# The SFT pass from the base model (TRN-SFT-1). The pairs hold the
# serialization of share/annotation.gbnf: a token list in, and labels
# out (TRN-SFT-2). The segment labels mask the prompt, so the loss
# covers the completion only.
base_model: Qwen/Qwen3-0.6B-Base

load_in_4bit: true
adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

datasets:
  - path: /scratch/corpus/pairs.jsonl
    type: input_output
dataset_prepared_path: /scratch/prepared/sft-base
output_dir: /scratch/outputs/sft-base

sequence_len: 2048
sample_packing: true
micro_batch_size: 8
gradient_accumulation_steps: 2

num_epochs: 2
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_torch

bf16: true
tf32: true
gradient_checkpointing: true
logging_steps: 10
saves_per_epoch: 1
