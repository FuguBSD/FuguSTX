[project]
name = "stx-corpus"
version = "0.0.0"
description = "The FuguSTX corpus pipeline and the tier T0 score script."
requires-python = ">=3.12"
dependencies = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stx_corpus"]
